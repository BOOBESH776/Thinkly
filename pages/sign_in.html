<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinkly</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- bootstrap -->
    <!-- external-css -->
    <link rel="stylesheet" href="/css/sign_in.css">
    <!-- external-css -->
</head>

<body>
    <main>
        <h1 class="thinkly text-center">Thinkly</h1>
        <div class="sign-card shadow">
            <div class="row d-flex justify-content-center">
                <div class="col-lg-12 col-sm-12">
                    <form action="">
                        <label for="Email" class="">Enter Email</label><br>
                        <input type="text" class="w-100" placeholder="Email"><br><br>
                        <label for="Password">Enter Password</label><br>
                        <input type="text" class="w-100" placeholder="Password">
                    </form>
                </div>
            </div><br>
            <div class="row">
                <div class="col text-end">
                    <p>Forget Password</p>
                </div>
            </div>
            <div class="row">
                <div class="col sign-container">
                    <button type="button" class="btn btn-main shadow w-100">Sign in to thinkly</button>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p>Create Account?&nbsp; &nbsp;<span><a href="sign_up.html">Sign_up</a></span></p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
