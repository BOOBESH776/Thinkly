<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz..</title>
    <link rel="stylesheet" href="./css/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- bootstrap -->
</head>

<body>

    <div class="fixed-top">
        <div class="return-page">
            <a href="./index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i>&nbsp; Return
                Home</a>
            <h3 class="quiz-title">Python Basics Quiz</h3>
            <div style="width: 55px;"></div>
        </div>
        <br>
        <article>
            <div class="hero-container d-flex justify-content-center">
                <div class="card shadow w-75">
                    <div class="card-body">
                        <h4 class="card-title no-questions">10 Questions</h4>
                        <p class="card-text">Estimated completion time : 5m</p>
                        <div class="instruction">

                            <div class="progress-box">
                                <div class="text-row">
                                    <span>Question <strong id="q-num">0</strong> of 10</span>
                                    <span id="pct-text">0% Complete</span>
                                </div>
                                <div class="bar-bg">
                                    <div id="bar-fill"></div>
                                </div>
                            </div>

                            <div class="timer">
                                <div class="card text-bg-danger" style="width: 15rem;">
                                    <div class="card-header">REMAINING CLOCK</div>
                                    <div class="card-body d-flex align-items-start justify-content-center">
                                        <div>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="#082F7E" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round"
                                                class="lucide lucide-timer">
                                                <line x1="10" x2="14" y1="2" y2="2" />
                                                <line x1="12" x2="15" y1="14" y2="11" />
                                                <circle cx="12" cy="14" r="8" />
                                            </svg>
                                        </div>
                                        <span>
                                            <div class="card-title" id="timer"></div>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </div>
    <br>

    <main>
        <div class="question-container d-flex justify-content-center">
            <div class="card w-75 shadow" id="q-card">
                // Quiz Question
            </div>
        </div>
        <br><br>

        <div class="submit-btn">
            <a href="./score.html">
                <button type="button" class="btn" id="validation">Submit</button>
            </a>
        </div>

    </main>
    <br><br>

    <footer class="quiz-footer-main">
        <div class="footer-container">
            <!-- Left Side: Branding with Real Logo & Status -->
            <div class="footer-brand-section">
                <div class="footer-logo-wrapper">
                    <!-- Replace 'logo.png' with your actual image path -->
                    <img src="assets/img/thinkly_logo-removebg-preview.png" alt="Thinkly Logo" class="footer-app-logo">
                </div>
                <p class="footer-tagline">Empowering continuous learning and assessment.</p>
            </div>

            <!-- Right Side: Links & Copyright -->
            <div class="footer-links-section">
                <div class="footer-links">
                    <a href="#">Support Center</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                </div>
                <div>
                    <p class="footer-copyright">&copy; 2026 Thinkly Inc. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="/js/quiz.js"></script>
    <script src="/js/score.js"></script>
</body>

</html>
